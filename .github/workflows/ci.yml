name: CI

on:
  push:
    # TEMPORARY: pc/HZN-2838 added to validate the pipeline end-to-end before merging.
    # Remove it once validated.
    branches: [main, dev, pc/HZN-2838]
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+*'
  pull_request:
    branches: [main, dev]

jobs:
  build-and-test:
    name: Build and Test
    runs-on: ubuntu-latest
    permissions: {}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: latest

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Compile contracts
        run: pnpm --filter @vela-facilitator/contracts compile

      - name: Run tests
        run: pnpm test

  publish-npm:
    name: Publish NPM Package
    needs: build-and-test
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: latest

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Determine release type
        env:
          MAINTAINERS_KEYS: ${{ vars.MAINTAINERS_KEYS }}
          # TEMPORARY: publishing prod releases from branch pc/HZN-2838 to validate
          # the pipeline end-to-end before merging. Revert to `main` once validated.
          PROD_RELEASE_BRANCH: pc/HZN-2838
          DEV_RELEASE_BRANCH: dev
        run: source "${GITHUB_WORKSPACE}/ci/setup_env.sh"

      - name: Publish NPM Package
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: "${GITHUB_WORKSPACE}/ci/publish_npm.sh"

      - name: Create GitHub Release
        if: env.PROD_RELEASE == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: "${GITHUB_WORKSPACE}/ci/gh_release.sh"

  publish-docker:
    name: Build and Push Docker Image
    needs: build-and-test
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')

    env:
      DOCKER_HUB_ORG: ${{ vars.DOCKER_HUB_ORG }}
      DOCKER_HUB_USERNAME: ${{ vars.DOCKER_HUB_USERNAME }}
      DOCKER_HUB_TOKEN: ${{ secrets.DOCKER_HUB_TOKEN }}
      GITHUB_TAG: ${{ github.ref_name }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ env.DOCKER_HUB_USERNAME }}
          password: ${{ env.DOCKER_HUB_TOKEN }}

      - name: Build and push facilitator image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./dockerfiles/Dockerfile
          push: true
          tags: |
            ${{ env.DOCKER_HUB_ORG }}/vela-facilitator:${{ env.GITHUB_TAG }}
            ${{ env.DOCKER_HUB_ORG }}/vela-facilitator:latest
